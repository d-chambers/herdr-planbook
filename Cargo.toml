[package]
name = "herdr-planbook"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Herdr pane and agent skill for repository project plans"
readme = "README.md"
repository = "https://github.com/d-chambers/herdr-planbook"
autotests = false

[[bin]]
name = "planbook"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
toml = "0.9"
unicode-segmentation = "1"
yaml-rust2 = { version = "0.10", default-features = false }

[profile.release]
lto = "thin"
strip = true
